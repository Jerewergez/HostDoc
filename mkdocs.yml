site_name: HostDoc 📖
site_description: Documentación auto-gestionada del proyecto Agente
site_url: https://jerewergez.github.io/HostDoc/
repo_url: https://github.com/Jerewergez/HostDoc
repo_name: Jerewergez/HostDoc

docs_dir: docs
site_dir: site

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.code.annotation
    - content.code.copy
    - navigation.indexes

plugins:
  - search
  - tags:
      tags_file: wiki/tags.md

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - admonition
  - footnotes
  - toc:
      permalink: true
  - attr_list
  - pymdownx.emoji

nav:
  - Inicio: index.md
  - Comandos Discord: wiki/reference/commands.md
  - Wiki:
      - Índice: wiki/README.md
      - Guías:
          - Uso de la wiki: wiki/guides/wiki-usage.md
      - Template: wiki/template.md
  - Arquitectura: ARCHITECTURE.md
  - Gentle-AI: GENTLE-AI.md
  - Docker Toolchain: DOCKER-TOOLCHAIN.md
  - Workflows: WORKFLOWS.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Jerewergez/Agente
